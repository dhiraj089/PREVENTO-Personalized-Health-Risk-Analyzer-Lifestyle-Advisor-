<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prevento – Health Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">🩺 Select Your Symptoms</h2>

                        <form action="/predict" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Choose from the following symptoms:</label>
                                <div class="row">
                                    <!-- List of symptom checkboxes -->
                                    {% set symptoms = ['fever', 'cough', 'headache', 'fatigue', 'nausea', 'vomiting', 'sore throat', 'runny nose', 'chills', 'body pain', 'diarrhea', 'breathlessness'] %}
                                    {% for symptom in symptoms %}
                                    <div class="col-md-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="symptoms" value="{{ symptom }}" id="symptom_{{ loop.index }}">
                                            <label class="form-check-label" for="symptom_{{ loop.index }}">{{ symptom.capitalize() }}</label>
                                        </div>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-3">Predict Disease</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
